version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trax_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trax_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-trax_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-trax} -d ${POSTGRES_DB:-trax_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trax_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trax_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@trax.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin_dev_password}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trax_network
    profiles:
      - tools  # Sobe apenas com: docker-compose --profile tools up -d

  redis:
    image: redis:7-alpine
    container_name: trax_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_password}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_dev_password}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trax_network

  caddy-dev:
    image: caddy:2-alpine
    container_name: trax_caddy_dev
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    profiles:
      - proxy

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_data:
    driver: local

networks:
  trax_network:
    driver: bridge
